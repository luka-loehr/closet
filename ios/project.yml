name: Closet
options:
  bundleIdPrefix: com.lukaloehr
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: M8M22924DJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Closet:
    type: application
    platform: iOS
    sources:
      - path: Closet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaloehr.closet
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: closet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a garment to try it on or add it to your closet.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save generated looks to your photo library.
        CODE_SIGN_ENTITLEMENTS: Closet/Closet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
